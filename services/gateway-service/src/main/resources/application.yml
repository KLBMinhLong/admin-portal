spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: domain-service
          uri: ${DOMAIN_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/**
      default-filters:
        - name: RequestRateLimiter
server:
  port: 8000
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  api-key: ${API_KEY:changeme}
