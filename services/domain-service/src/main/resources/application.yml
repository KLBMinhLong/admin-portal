spring:
  application:
    name: domain-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    log-startup-info: false
  logging:
    config: classpath:log4j2/log4j2.xml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adminportal}
    username: ${DB_USERNAME:portaluser}
    password: ${DB_PASSWORD:changeme}
    hikari:
      pool-name: DomainHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_domain
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:changeme}
      timeout: 3000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: domain-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.adminportal.*"

# MyBatis config
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# Camunda BPMN
camunda:
  bpm:
    auto-deployment-enabled: true
    locations: classpath:bpmn/*.bpmn
    database:
      schema-update: true
    admin-user:
      id: admin
      password: ${CAMUNDA_ADMIN_PASSWORD:admin}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  api-key: ${API_KEY:changeme}
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  token:
    secret: ${TOKEN_SECRET:supersecretkey_changeme_in_production_min32chars}
  encryption:
    enabled: true
    secret-key: ${ENCRYPT_SECRET:encryptkey_changeme_32chars_1234}

